name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar plugin
        run: mvn -B clean package
      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutStyleScoreboard
          path: target/DonutStyleScoreboard.jar
